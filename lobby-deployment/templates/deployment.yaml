apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lobby.fullname" . }}
  labels:
    type: frontend
    {{- include "lobby.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lobby.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        type: frontend
        {{- include "lobby.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if eq .Values.namespace "staging" }}
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      {{- end }}
      {{- if eq .Values.namespace "prod" }}
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      {{- end }}
      containers:
        - name: {{ .Values.lobbyName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: CLIENT
            value: "{{ .Values.apiKey }}"
          - name: CURRENCY
            value: "{{ .Values.currency }}"
          - name: BRAND
            value: "{{ .Values.brand }}"
          - name: DEFAULT_LANGUAGE
            value: "{{ .Values.defaultLanguage }}"
          - name: SOURCE_URL
            value: "https://images.srvptt.com/"
          {{- if eq .Values.lobbyTemplate "t1" }}
          - name: THEME
            value: "red"
          {{- end }}
          {{- if eq .Values.lobbyTemplate "t2" }}
          - name: THEME
            value: "red"
          {{- end }}
          {{- if eq .Values.lobbyTemplate "t3" }}
          - name: "WAPTEMPLATE"
            value: "3"
          - name: HOMEPAGE
            value: "[\"t3-1\",\"t3-2\",\"t3-3\"]"
          - name: THEME
            value: "black"
          {{- end }}
          {{- if eq .Values.lobbyTemplate "t4" }}
          - name: "WAPTEMPLATE"
            value: "4"
          - name: HOMEPAGE
            value: "[\"t4-1\",\"t4-2\",\"t4-3\",\"t4-4\"]"
          - name: THEME
            value: "black"
          {{- end }}
          {{- if eq .Values.lobbyTemplate "t5" }}
          - name: "WAPTEMPLATE"
            value: "4"
          - name: HOMEPAGE
            value: "[\"t4-1\",\"t4-2\",\"t4-3\",\"t4-4\"]"
          - name: THEME
            value: "black"
          {{- end }}
          {{- if eq .Values.lobbyTemplate "t8" }}
          - name: "WAPTEMPLATE"
            value: "8"
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: site-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: site-data
          emptyDir: {}