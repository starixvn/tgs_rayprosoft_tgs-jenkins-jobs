apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lobby-hkjp-${domain_}
  namespace: prod
  labels: 
    tgs.info: ${domain}-${invite_code}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header Brand-Token eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYW1lIjoiSEtKUCIsInN1YiI6IjdhZmRhOTdlLTU0YTMtNGMwZi1iOTU1LThjNGI3OGIxZjZiOCIsIm5iZiI6MTYzNzYzNjYyNywiZXhwIjoxNjM3NjQwMjI3LCJpYXQiOjE2Mzc2MzY2MjcsImlzcyI6InRncyJ9.AB2NYay9D0Dm010QDL4MfvLqzS5hGdY1ouOyUVXXISu39Z0WRwMPoz8k4r6dbBDFYLiF_kyg3iTTccGZnNi6xZr4FjdNl2apS1jmxnw--f2OsPtB4_jhv-1SNF_Qcb5HYZxhS3aV-TI_z8fVJZFKG8sAre5JpirXSkgCpmZrNZxtTsp7Ldle2M5oQnOL-p0jyHd2D4UDCy_8j6uosMLqBtZ_S0d5dBbSGTmm5pypxmgMRGJGoZnLgox85ppm6B-LdiJWnXXRLulDQpUa4AstdAeby_Zh8IckF5FTmDQaq5ceSEU098iVcYfajyEst-eQguxOSOGkbsY3YQS0TBKK4g;
        proxy_set_header Agent-Invitation-Code ${invite_code};
spec:
  ingressClassName: nginx
  rules:
  - host: ${domain}
    http:
      paths:
      - pathType: Prefix
        path: /api/brandcommunication
        backend:
          service:
            name: brand-api
            port:
              number: 80
      - pathType: Prefix
        path: /api/brandlivechat
        backend:
          service:
            name: brand-api
            port:
              number: 80
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: operator-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: lobby-hkjp
            port:
              number: 80
  - host: www.${domain}
    http:
      paths:
      - pathType: Prefix
        path: /api/brandcommunication
        backend:
          service:
            name: brand-api
            port:
              number: 80
      - pathType: Prefix
        path: /api/brandlivechat
        backend:
          service:
            name: brand-api
            port:
              number: 80
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: operator-api
            port:
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: lobby-hkjp
            port:
              number: 80