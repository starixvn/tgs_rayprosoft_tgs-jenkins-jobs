apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lobby-mgm-${domain_}
  namespace: prod
  labels: 
    tgs.info: ${domain}-${invite_code}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header Brand-Token eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYW1lIjoiTUdNIiwic3ViIjoiMjNjZjIyNzYtYjg5NS00NGIzLWE1MTEtODNhNjYyMjhmMjliIiwibmJmIjoxNjQxMjYxNzk2LCJleHAiOjE2NDEyNjUzOTYsImlhdCI6MTY0MTI2MTc5NiwiaXNzIjoidGdzIn0.loS_qzXE-dYBoewkrfXtE1zeZ-eAPk_7kzNjioqXYTt5JEoi7wEJdLM-t_2DgYd8ueAvx71FGkXdFhN708sNPQZw1TVl7LwpcI3QZdeNtVv43SgYT1jJgEGT6HPaAYFkaikIfPS8OsrJQFir7ruCZ7fvnabnph6tP-st1xjSbWdim44_SIFZ9mY95uSwEi0Irfci08Zmu_lMvdVPDeQHK8TKvyMuaCz04NmrnPrdk05zmsXyZwxVtEiSgW6tCp1jHTlK29oNfGbl3xE1rv5o_2J5sBuLA9QD_7XUV59NH06KQOTZF27xzKO4qASEUQ--5xAv2cCevEcSR_Pz8hmsCg;
        proxy_set_header Agent-Invitation-Code ${invite_code};
spec:
  ingressClassName: nginx
  rules:
  - host: ${domain}
    http:
      paths:
      - pathType: Prefix
        path: /api/brandcommunication
        backend:
          service:
            name: brand-api
            port: 
              number: 80
      - pathType: Prefix
        path: /api/brandlivechat
        backend:
          service:
            name: brand-api
            port: 
              number: 80
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: op-api-mgm
            port: 
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: lobby-mgm
            port: 
              number: 80
  - host: www.${domain}
    http:
      paths:
      - pathType: Prefix
        path: /api/brandcommunication
        backend:
          service:
            name: brand-api
            port: 
              number: 80
      - pathType: Prefix
        path: /api/brandlivechat
        backend:
          service:
            name: brand-api
            port: 
              number: 80
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: op-api-mgm
            port: 
              number: 80
      - pathType: Prefix
        path: /
        backend:
          service:
            name: lobby-mgm
            port: 
              number: 80