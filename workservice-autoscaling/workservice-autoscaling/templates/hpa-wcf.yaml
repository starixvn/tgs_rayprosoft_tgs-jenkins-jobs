apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: game-gamerecord-awc-workservice
  labels:
    helm.sh/chart: game-gamerecord-awc-workservice-0.1.0
    app.kubernetes.io/name: game-gamerecord-awc-workservice
    app: game-gamerecord-awc-workservice
    app.kubernetes.io/instance: RELEASE-NAME
    tgs.kind: game
    tgs.game.kind: gamerecord
    tgs.gameprovider.kind: awc
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-gamerecord-awc-workservice
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        targe:
          type: Utilization 
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
