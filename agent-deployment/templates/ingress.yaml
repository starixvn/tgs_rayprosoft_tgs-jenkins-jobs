apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.lobbyName }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header Brand-Token {{ .Values.brandToken }};
spec:
  ingressClassName: nginx
  rules:
  {{- range .Values.domains }}
  - host: {{ .domain }}
    http:
      paths:
      - path: /api
        backend:
          service: 
            name: agent-api
            port: 
              number: 80
      - path: /
        backend:
          service:
            name: {{ .lobbyName }}
            port: 
              number: 80
  {{- end }} 