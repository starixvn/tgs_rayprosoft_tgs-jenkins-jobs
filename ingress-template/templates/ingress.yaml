apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.lobbyName }}
  namespace: staging
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: {{ .Values.lobbyName }}
            port: 
              number: 80